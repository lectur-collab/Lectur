    <script>
      // Gracefully prevent Vite HMR WebSocket connection failure noise from surfacing in preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
